<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Финансы</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root {
    --bg: var(--tg-theme-bg-color, #ffffff);
    --bg2: var(--tg-theme-secondary-bg-color, #f3f4f8);
    --text: var(--tg-theme-text-color, #0f1222);
    --hint: var(--tg-theme-hint-color, #8b90a0);
    --accent: var(--tg-theme-button-color, #5b5bf6);
    --accent-text: var(--tg-theme-button-text-color, #ffffff);
    --danger: #ef4444;
    --warn: #f59e0b;
    --good: #16a34a;
    --line: color-mix(in srgb, var(--hint) 18%, transparent);
    --soft: color-mix(in srgb, var(--accent) 12%, var(--bg));
    --r: 20px;
    --shadow: 0 1px 2px rgba(15,18,34,.04), 0 6px 20px rgba(15,18,34,.06);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; background: var(--bg2); color: var(--text);
    font: 15px/1.38 -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, sans-serif;
    -webkit-font-smoothing: antialiased; }
  body { padding-bottom: calc(92px + env(safe-area-inset-bottom)); min-height: 100vh; overscroll-behavior-y: none; }
  button { font: inherit; color: inherit; border: 0; background: none; cursor: pointer; padding: 0; }
  input { font: inherit; color: var(--text); }
  .num { font-variant-numeric: tabular-nums; }
  .muted { color: var(--hint); }

  .page { display: none; padding: 12px 16px 0; animation: fade .2s ease; }
  .page.active { display: block; }
  @keyframes fade { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }

  .box { background: var(--bg); border-radius: var(--r); padding: 16px; margin-bottom: 14px; box-shadow: var(--shadow); }
  .head { display: flex; align-items: center; justify-content: space-between; margin: 20px 4px 10px; }
  .head h2 { margin: 0; font-size: 18px; font-weight: 700; letter-spacing: -.01em; }
  .head .link { color: var(--accent); font-size: 14px; font-weight: 500; }
  .box > .head:first-child { margin-top: 0; }

  /* Верх */
  .top { display: flex; align-items: center; justify-content: space-between; padding: 4px 4px 12px; }
  .hello { font-size: 13px; color: var(--hint); }
  .hello b { display: block; font-size: 20px; color: var(--text); letter-spacing: -.01em; }
  .iconbtn { width: 40px; height: 40px; border-radius: 14px; background: var(--bg); display: grid; place-items: center;
    font-size: 18px; box-shadow: var(--shadow); }

  /* Главная карточка */
  .hero { position: relative; overflow: hidden; border-radius: 26px; padding: 20px; color: #fff;
    background: radial-gradient(120% 140% at 100% 0%, #c084fc 0%, transparent 55%),
                linear-gradient(135deg, #4f46e5 0%, #7c3aed 70%, #9333ea 100%);
    box-shadow: 0 14px 30px -10px rgba(91,63,230,.55); }
  .hero::after { content: ""; position: absolute; right: -40px; bottom: -60px; width: 180px; height: 180px;
    border-radius: 50%; background: rgba(255,255,255,.08); }
  .hero .lbl { font-size: 13px; opacity: .8; display: flex; align-items: center; gap: 8px; }
  .hero .total { font-size: 36px; font-weight: 800; letter-spacing: -.03em; margin: 4px 0 16px; cursor: pointer; }
  .hero .pills { display: flex; gap: 8px; position: relative; z-index: 1; }
  .pill { flex: 1; background: rgba(255,255,255,.14); border-radius: 16px; padding: 10px 12px; backdrop-filter: blur(6px); }
  .pill .pl { font-size: 12px; opacity: .8; display: flex; align-items: center; gap: 4px; }
  .pill .pv { font-weight: 700; font-size: 15px; margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .hero .saved { font-size: 12.5px; opacity: .85; margin-top: 12px; position: relative; z-index: 1; }

  /* Быстрые действия */
  .quick { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; margin: 16px 0 4px; }
  .qa { display: flex; flex-direction: column; align-items: center; gap: 6px; font-size: 12.5px; font-weight: 500; }
  .qa span { width: 52px; height: 52px; border-radius: 18px; display: grid; place-items: center; font-size: 22px;
    background: var(--bg); box-shadow: var(--shadow); transition: transform .12s; }
  .qa:active span { transform: scale(.92); }

  /* Карты */
  .cards { display: flex; gap: 12px; overflow-x: auto; margin: 0 -16px; padding: 2px 16px 10px;
    scrollbar-width: none; scroll-snap-type: x mandatory; }
  .cards::-webkit-scrollbar { display: none; }
  .card { position: relative; overflow: hidden; flex: 0 0 172px; height: 108px; border-radius: 20px; padding: 14px; color: #fff;
    text-align: left; display: flex; flex-direction: column; justify-content: space-between; scroll-snap-align: start;
    box-shadow: 0 8px 18px -8px rgba(0,0,0,.35); }
  .card::before { content: ""; position: absolute; right: -30px; top: -30px; width: 110px; height: 110px; border-radius: 50%;
    background: rgba(255,255,255,.13); }
  .card .ct { display: flex; justify-content: space-between; align-items: center; font-size: 13px; position: relative; }
  .card .cn { opacity: .92; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-weight: 500; }
  .card .cc { font-size: 11px; font-weight: 700; opacity: .75; letter-spacing: .05em; }
  .card .cb { font-size: 20px; font-weight: 800; letter-spacing: -.02em; position: relative; }
  .card.add { background: var(--bg); color: var(--accent); box-shadow: none; border: 2px dashed var(--line);
    align-items: center; justify-content: center; font-weight: 600; flex-basis: 110px; }
  .card.add::before { display: none; }

  /* Операции */
  .op { display: flex; align-items: center; gap: 12px; padding: 10px 0; width: 100%; text-align: left; }
  .op + .op { border-top: 1px solid var(--line); }
  .ic { width: 42px; height: 42px; border-radius: 14px; display: grid; place-items: center; font-size: 20px; flex: none;
    background: var(--bg2); }
  .op .mid { flex: 1; min-width: 0; }
  .op .t1 { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .op .t2 { font-size: 12.5px; color: var(--hint); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .op .amt { font-weight: 700; white-space: nowrap; text-align: right; }
  .op .amt small { display: block; font-weight: 400; font-size: 12px; color: var(--hint); }
  .amt.in { color: var(--good); }
  .day { font-size: 13px; font-weight: 600; color: var(--hint); margin: 16px 6px 8px; display: flex; justify-content: space-between; }
  .empty { color: var(--hint); text-align: center; padding: 18px 8px; font-size: 14px; }
  .cta { display: flex; align-items: center; gap: 12px; width: 100%; text-align: left; }
  .cta .ic { background: var(--soft); }
  .cta .go { color: var(--accent); font-weight: 600; font-size: 14px; }

  /* Прогресс */
  .track { height: 8px; border-radius: 4px; background: var(--bg2); overflow: hidden; }
  .fill { height: 100%; border-radius: 4px; background: var(--accent); transition: width .4s ease; }
  .fill.warn { background: var(--warn); } .fill.over { background: var(--danger); }
  .brow { padding: 10px 0; }
  .brow + .brow { border-top: 1px solid var(--line); }
  .brow .r1 { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; }
  .brow .r1 .ic { width: 34px; height: 34px; border-radius: 11px; font-size: 17px; }
  .brow .nm { flex: 1; min-width: 0; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .brow .vl { text-align: right; font-weight: 700; white-space: nowrap; }
  .brow .vl small { display: block; font-size: 12px; font-weight: 400; color: var(--hint); }
  .note-over { color: var(--danger); } .note-warn { color: var(--warn); }

  /* Платежи */
  .due { display: flex; align-items: center; gap: 12px; padding: 10px 0; }
  .due + .due { border-top: 1px solid var(--line); }
  .due .mid { flex: 1; min-width: 0; }
  .due .t1 { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .due .t2 { font-size: 12.5px; color: var(--hint); }
  .due .t2.late { color: var(--danger); font-weight: 500; }
  .small-btn { padding: 8px 12px; border-radius: 12px; background: var(--soft); color: var(--accent); font-weight: 600; font-size: 13.5px; white-space: nowrap; }

  /* Аналитика */
  .monthbar { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
  .monthbar button { width: 42px; height: 42px; border-radius: 14px; background: var(--bg); font-size: 20px; box-shadow: var(--shadow); }
  .monthbar .mt { font-weight: 700; font-size: 18px; }
  .seg { display: grid; grid-auto-columns: 1fr; grid-auto-flow: column; background: color-mix(in srgb, var(--hint) 14%, transparent);
    border-radius: 14px; padding: 3px; }
  .seg button { padding: 8px 6px; border-radius: 11px; font-weight: 600; font-size: 14px; color: var(--hint); }
  .seg button.on { background: var(--bg); color: var(--text); box-shadow: 0 1px 4px rgba(0,0,0,.12); }
  .bigstat { font-size: 30px; font-weight: 800; letter-spacing: -.02em; margin: 14px 0 2px; }
  .delta { display: inline-flex; align-items: center; gap: 4px; font-size: 13px; font-weight: 600; padding: 3px 8px;
    border-radius: 8px; }
  .delta.up { background: color-mix(in srgb, var(--danger) 13%, transparent); color: var(--danger); }
  .delta.down { background: color-mix(in srgb, var(--good) 13%, transparent); color: var(--good); }
  .delta.inc.up { background: color-mix(in srgb, var(--good) 13%, transparent); color: var(--good); }
  .delta.inc.down { background: color-mix(in srgb, var(--danger) 13%, transparent); color: var(--danger); }
  .statline { display: flex; gap: 16px; font-size: 13px; color: var(--hint); margin-top: 8px; flex-wrap: wrap; }
  .statline b { color: var(--text); }
  .chart { position: relative; margin-top: 14px; }
  .chart svg { display: block; width: 100%; height: 150px; overflow: visible; }
  .chart .tip { position: absolute; top: -6px; transform: translate(-50%, -100%); background: var(--text); color: var(--bg);
    font-size: 12px; font-weight: 600; padding: 5px 8px; border-radius: 8px; white-space: nowrap; pointer-events: none;
    opacity: 0; transition: opacity .12s; }
  .chart .tip.show { opacity: 1; }
  .axis { display: flex; justify-content: space-between; font-size: 11px; color: var(--hint); margin-top: 6px; }

  /* Фильтры, поиск */
  .search { display: flex; align-items: center; gap: 8px; background: var(--bg); border-radius: 14px; padding: 0 12px;
    box-shadow: var(--shadow); margin-bottom: 10px; }
  .search input { flex: 1; border: 0; outline: 0; background: none; padding: 12px 0; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; }
  .chips.scroll { flex-wrap: nowrap; overflow-x: auto; scrollbar-width: none; margin: 0 -16px; padding: 2px 16px 4px; }
  .chips.scroll::-webkit-scrollbar { display: none; }
  .chip { padding: 8px 13px; border-radius: 12px; background: var(--bg2); white-space: nowrap; font-size: 14px; font-weight: 500; }
  .page .chip { background: var(--bg); box-shadow: var(--shadow); }
  .chip.on, .page .chip.on { background: var(--accent); color: var(--accent-text); }

  /* Меню «Ещё» */
  .menu .mi { display: flex; align-items: center; gap: 14px; padding: 12px 0; width: 100%; text-align: left; }
  .menu .mi + .mi { border-top: 1px solid var(--line); }
  .menu .mi .mid { flex: 1; }
  .menu .mi .t2 { font-size: 12.5px; color: var(--hint); }
  .menu .mi .ar { color: var(--hint); font-size: 20px; }
  .switch { width: 46px; height: 28px; border-radius: 14px; background: color-mix(in srgb, var(--hint) 35%, transparent);
    position: relative; transition: .2s; flex: none; }
  .switch::after { content: ""; position: absolute; top: 3px; left: 3px; width: 22px; height: 22px; border-radius: 50%;
    background: #fff; transition: .2s; box-shadow: 0 1px 3px rgba(0,0,0,.25); }
  .switch.on { background: var(--accent); } .switch.on::after { left: 21px; }

  /* Нижнее меню */
  nav { position: fixed; left: 10px; right: 10px; bottom: calc(10px + env(safe-area-inset-bottom)); z-index: 5;
    background: color-mix(in srgb, var(--bg) 88%, transparent); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
    border-radius: 24px; box-shadow: 0 8px 30px rgba(15,18,34,.16); display: flex; padding: 6px; }
  nav button { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 1px; font-size: 10.5px;
    color: var(--hint); padding: 5px 0; border-radius: 16px; font-weight: 500; }
  nav button .ni { font-size: 20px; filter: grayscale(1); opacity: .55; transition: .15s; }
  nav button.on { color: var(--accent); }
  nav button.on .ni { filter: none; opacity: 1; }
  nav .plus { flex: 0 0 62px; }
  nav .plus span { width: 50px; height: 50px; border-radius: 17px; display: grid; place-items: center; font-size: 28px;
    background: linear-gradient(135deg, #4f46e5, #9333ea); color: #fff; box-shadow: 0 6px 16px rgba(91,63,230,.45); }

  /* Шторка */
  .backdrop { position: fixed; inset: 0; background: rgba(8,10,20,.45); opacity: 0; pointer-events: none;
    transition: opacity .22s; z-index: 10; }
  .backdrop.open { opacity: 1; pointer-events: auto; }
  .sheet { position: fixed; left: 0; right: 0; bottom: 0; max-height: 94vh; overflow-y: auto; background: var(--bg);
    border-radius: 26px 26px 0 0; padding: 8px 16px calc(16px + env(safe-area-inset-bottom));
    transform: translateY(105%); transition: transform .28s cubic-bezier(.2,.8,.2,1); z-index: 11; }
  .sheet.open { transform: none; }
  .grab { width: 40px; height: 5px; border-radius: 3px; background: var(--line); margin: 0 auto 12px; }
  .sheet h2 { margin: 0 0 14px; font-size: 20px; letter-spacing: -.01em; }
  .field { margin-bottom: 14px; }
  .field > label { display: block; font-size: 13px; color: var(--hint); margin-bottom: 6px; font-weight: 500; }
  .inp { width: 100%; padding: 12px 14px; border-radius: 14px; border: 0; background: var(--bg2); outline: 0; }
  .inp:focus { box-shadow: 0 0 0 2px var(--accent) inset; }
  .colors { display: flex; gap: 10px; flex-wrap: wrap; }
  .colors button { width: 34px; height: 34px; border-radius: 50%; }
  .colors button.on { outline: 3px solid var(--accent); outline-offset: 2px; }
  .emojis { display: flex; gap: 6px; flex-wrap: wrap; }
  .emojis button { width: 42px; height: 42px; border-radius: 12px; background: var(--bg2); font-size: 21px; }
  .emojis button.on { background: var(--soft); outline: 2px solid var(--accent); }
  .btn { width: 100%; padding: 15px; border-radius: 16px; background: var(--accent); color: var(--accent-text);
    font-weight: 700; font-size: 16px; margin-top: 4px; }
  .btn.sec { background: var(--bg2); color: var(--text); }
  .btn.del { background: color-mix(in srgb, var(--danger) 10%, var(--bg)); color: var(--danger); }
  .btn:disabled { opacity: .45; }
  .btnrow { display: flex; gap: 8px; } .btnrow .btn { flex: 1; }
  .err { color: var(--danger); font-size: 13px; min-height: 18px; margin: -4px 0 6px; }

  /* Форма операции с калькулятором */
  .amtbox { text-align: center; padding: 10px 0 8px; }
  .amtbox .expr { font-size: 15px; color: var(--hint); min-height: 20px; }
  .amtbox .val { font-size: 40px; font-weight: 800; letter-spacing: -.03em; line-height: 1.1; }
  .amtbox .val .cur { color: var(--hint); font-weight: 700; margin-left: 4px; }
  .cats { display: grid; grid-auto-flow: column; grid-template-rows: repeat(2, auto); gap: 6px; overflow-x: auto;
    scrollbar-width: none; margin: 0 -16px 12px; padding: 0 16px; }
  .cats::-webkit-scrollbar { display: none; }
  .cat { width: 70px; display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: 11.5px;
    padding: 4px 0; border-radius: 14px; }
  .cat .ic { width: 44px; height: 44px; border-radius: 15px; transition: .15s; }
  .cat span:last-child { max-width: 66px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: var(--hint); }
  .cat.on .ic { outline: 2.5px solid var(--accent); outline-offset: 2px; }
  .cat.on span:last-child { color: var(--text); font-weight: 600; }
  .row2 { display: flex; gap: 8px; margin-bottom: 10px; align-items: center; }
  .row2 .inp { padding: 10px 12px; }
  .datebtn { padding: 10px 12px; border-radius: 14px; background: var(--bg2); white-space: nowrap; font-weight: 500; position: relative; }
  .datebtn input { position: absolute; inset: 0; opacity: 0; width: 100%; }
  .keypad { display: grid; grid-template-columns: repeat(4, 1fr); gap: 7px; margin-top: 4px; }
  .keypad button { height: 50px; border-radius: 14px; background: var(--bg2); font-size: 21px; font-weight: 600; }
  .keypad button:active { transform: scale(.95); background: color-mix(in srgb, var(--hint) 22%, var(--bg2)); }
  .keypad .op { color: var(--accent); background: var(--soft); }
  .keypad .ok { grid-row: span 2; height: auto; background: var(--accent); color: var(--accent-text); font-size: 26px; }

  .toast { position: fixed; left: 50%; bottom: calc(100px + env(safe-area-inset-bottom)); transform: translateX(-50%) translateY(16px);
    opacity: 0; background: rgba(15,18,34,.92); color: #fff; padding: 11px 16px; border-radius: 14px; font-size: 14px;
    transition: .22s; z-index: 30; pointer-events: none; white-space: nowrap; max-width: 92vw; overflow: hidden; text-overflow: ellipsis; }
  .toast.show { opacity: 1; transform: translateX(-50%); }
  .loading { text-align: center; color: var(--hint); padding: 80px 0; }

  /* Экран блокировки */
  body.locked { overflow: hidden; }
  body.locked .page, body.locked nav { visibility: hidden; }
  .lock { position: fixed; inset: 0; z-index: 50; display: none; flex-direction: column; align-items: center;
    justify-content: center; padding: 24px 24px calc(24px + env(safe-area-inset-bottom)); color: #fff;
    background: radial-gradient(120% 80% at 100% 0%, #9333ea 0%, transparent 60%), linear-gradient(160deg, #312e81, #4c1d95 60%, #581c87); }
  .lock.show { display: flex; }
  .lock .logo { width: 72px; height: 72px; border-radius: 24px; background: rgba(255,255,255,.15); display: grid;
    place-items: center; font-size: 36px; margin-bottom: 18px; }
  .lock .lt { font-size: 20px; font-weight: 700; margin-bottom: 6px; text-align: center; }
  .lock .ls { font-size: 14px; opacity: .75; min-height: 20px; text-align: center; }
  .dots { display: flex; gap: 18px; margin: 26px 0 34px; }
  .dots i { width: 15px; height: 15px; border-radius: 50%; border: 2px solid rgba(255,255,255,.7); transition: .15s; }
  .dots i.on { background: #fff; border-color: #fff; transform: scale(1.1); }
  .dots.shake { animation: shake .4s; }
  @keyframes shake { 20%,60% { transform: translateX(-10px); } 40%,80% { transform: translateX(10px); } }
  .pinpad { display: grid; grid-template-columns: repeat(3, 76px); gap: 16px 26px; }
  .pinpad button { width: 76px; height: 76px; border-radius: 50%; background: rgba(255,255,255,.13); color: #fff;
    font-size: 30px; font-weight: 500; }
  .pinpad button:active { background: rgba(255,255,255,.3); }
  .pinpad button.ghost { background: none; font-size: 26px; }
  .pinpad button:disabled { opacity: .3; }
  .lock .forgot { margin-top: 26px; color: #fff; opacity: .7; font-size: 14px; }
  .detail { text-align: center; margin-bottom: 16px; }
  .detail .ic { width: 60px; height: 60px; border-radius: 20px; font-size: 30px; margin: 0 auto 8px; }
  .detail .dv { font-size: 30px; font-weight: 800; letter-spacing: -.02em; }
  .kv { display: flex; justify-content: space-between; padding: 11px 0; border-top: 1px solid var(--line); gap: 12px; }
  .kv span:first-child { color: var(--hint); }
  .kv span:last-child { text-align: right; font-weight: 500; }
  .goal { padding: 12px 0; }
  .goal + .goal { border-top: 1px solid var(--line); }
  .goal .r1 { display: flex; align-items: center; gap: 12px; margin-bottom: 10px; }
  .goal .mid { flex: 1; min-width: 0; }
  .goal .t1 { font-weight: 700; }
  .goal .t2 { font-size: 12.5px; color: var(--hint); }
  .goal .pct { font-weight: 800; font-size: 17px; }

  /* Импорт скриншотов */
  .shots { display: flex; gap: 8px; overflow-x: auto; margin: 0 -16px 12px; padding: 0 16px; scrollbar-width: none; }
  .shots img { height: 120px; border-radius: 12px; flex: none; box-shadow: var(--shadow); }
  .pick { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; height: 140px;
    border: 2px dashed var(--line); border-radius: 18px; color: var(--accent); font-weight: 600; margin-bottom: 12px; position: relative; }
  .pick input { position: absolute; inset: 0; opacity: 0; }
  .pick .big { font-size: 34px; }
  .spinner { width: 42px; height: 42px; border-radius: 50%; border: 4px solid var(--soft); border-top-color: var(--accent);
    animation: spin 1s linear infinite; margin: 30px auto 14px; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .imp { display: flex; gap: 10px; align-items: flex-start; padding: 11px 0; }
  .imp + .imp { border-top: 1px solid var(--line); }
  .imp.off { opacity: .45; }
  .imp .chk { width: 24px; height: 24px; border-radius: 8px; border: 2px solid var(--line); flex: none; margin-top: 9px;
    display: grid; place-items: center; font-size: 14px; color: #fff; }
  .imp.on .chk { background: var(--accent); border-color: var(--accent); }
  .imp .ic { width: 40px; height: 40px; }
  .imp .mid { flex: 1; min-width: 0; }
  .imp .t1 { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

<script>
/* ================================================================ Хранилище
   В Telegram — CloudStorage (данные привязаны к аккаунту).
   В обычном браузере — localStorage, чтобы можно было проверить. */
const tg = window.Telegram && window.Telegram.WebApp;
const CLOUD = !!(tg && tg.initData && tg.isVersionAtLeast && tg.isVersionAtLeast('6.9'));
const CHUNK = 45; // операций на ключ (лимит Telegram — 4096 символов на значение)

const store = {
  get(keys) {
    if (!keys.length) return Promise.resolve({});
    if (!CLOUD) { const o = {}; keys.forEach(k => o[k] = localStorage.getItem('fin_' + k) || ''); return Promise.resolve(o); }
    const batches = [];
    for (let i = 0; i < keys.length; i += 50) batches.push(keys.slice(i, i + 50));
    return Promise.all(batches.map(b => new Promise((res, rej) =>
      tg.CloudStorage.getItems(b, (e, v) => e ? rej(e) : res(v || {}))))).then(p => Object.assign({}, ...p));
  },
  set(k, v) {
    if (!CLOUD) { localStorage.setItem('fin_' + k, v); return Promise.resolve(); }
    return new Promise((res, rej) => tg.CloudStorage.setItem(k, v, e => e ? rej(e) : res()));
  },
  del(k) {
    if (!CLOUD) { localStorage.removeItem('fin_' + k); return Promise.resolve(); }
    return new Promise(res => tg.CloudStorage.removeItem(k, () => res()));
  },
};

/* ================================================================ Справочники */
const CURS = {
  KZT: ['₸', 'Тенге'], RUB: ['₽', 'Рубль'], USD: ['$', 'Доллар'], EUR: ['€', 'Евро'],
  UZS: ['сўм', 'Сум'], KGS: ['сом', 'Сом'], CNY: ['¥', 'Юань'], TRY: ['₺', 'Лира'],
  GBP: ['£', 'Фунт'], AED: ['AED', 'Дирхам'], GEL: ['₾', 'Лари'], BYN: ['Br', 'Бел. рубль'],
};
const sym = c => (CURS[c] || [c])[0];
// [название, эмодзи, оттенок фона]
const EXP_CATS = [
  ['Продукты','🛒','#22c55e'],['Кафе','🍔','#f97316'],['Транспорт','🚕','#eab308'],['Авто','🚗','#64748b'],
  ['Дом','🏠','#a855f7'],['Связь','📱','#06b6d4'],['Здоровье','💊','#ef4444'],['Красота','💅','#ec4899'],
  ['Одежда','👕','#6366f1'],['Развлечения','🎉','#f43f5e'],['Путешествия','✈️','#0ea5e9'],['Образование','📚','#8b5cf6'],
  ['Подарки','🎁','#d946ef'],['Подписки','🔁','#14b8a6'],['Дети','🧸','#f59e0b'],['Питомцы','🐾','#a16207'],['Другое','📦','#94a3b8'],
];
const INC_CATS = [['Зарплата','💼','#16a34a'],['Подработка','💸','#0ea5e9'],['Кэшбэк','🪙','#eab308'],
  ['Подарок','🎁','#d946ef'],['Проценты','🏦','#6366f1'],['Другое','📦','#94a3b8']];
const COLORS = ['#ef4444','#f97316','#eab308','#22c55e','#14b8a6','#3b82f6','#6366f1','#a855f7','#ec4899','#111827'];
const GRADS = { // карта: цвет → градиент
  '#ef4444':'#f97316','#f97316':'#facc15','#eab308':'#f97316','#22c55e':'#14b8a6','#14b8a6':'#3b82f6',
  '#3b82f6':'#6366f1','#6366f1':'#a855f7','#a855f7':'#ec4899','#ec4899':'#f43f5e','#111827':'#475569',
};
const GOAL_EMO = ['🎯','✈️','🏠','🚗','📱','💻','🎓','💍','🏖️','🛡️','🎁','🐷'];

/* ================================================================ Данные */
let meta = { n: 0, next: 1, cats: [], icats: [], base: 'KZT', rates: {}, ratesAt: 0, hide: false };
let cards = [];   // {id, name, start, color, cur}
let ops = [];     // {id, t, k:'e'|'i'|'t'|'a'|'g', a, c, f, to, a2, n}
let budgets = {}; // {категория|'*': лимит в основной валюте}
let goals = [];   // {id, name, emoji, target, cur, color, start}
let recur = [];   // {id, name, a, f, c, per:'w'|'m'|'y', next:'YYYY-MM-DD'}

const pack = o => { const r = [o.id, o.t, o.k, o.a, o.c || '', o.f || 0, o.to || 0];
  if (o.a2 != null || o.n) r.push(o.a2 != null ? o.a2 : null); if (o.n) r.push(o.n); return r; };
const unpack = r => ({ id: r[0], t: r[1], k: r[2], a: r[3], c: r[4], f: r[5], to: r[6],
  a2: r[7] != null ? r[7] : undefined, n: r[8] || '' });

async function load() {
  const b = await store.get(['meta', 'cards', 'budgets', 'goals', 'recur']);
  if (b.meta) meta = Object.assign(meta, JSON.parse(b.meta));
  if (b.cards) cards = JSON.parse(b.cards);
  if (b.budgets) budgets = JSON.parse(b.budgets);
  if (b.goals) goals = JSON.parse(b.goals);
  if (b.recur) recur = JSON.parse(b.recur);
  cards.forEach(c => { c.cur = c.cur || 'KZT'; });
  const keys = Array.from({ length: meta.n }, (_, i) => 'o' + i);
  const ch = await store.get(keys);
  ops = [];
  keys.forEach(k => { if (ch[k]) JSON.parse(ch[k]).forEach(r => ops.push(unpack(r))); });
  ops.sort((a, b) => a.t - b.t || a.id - b.id);
}
const saveMeta = () => store.set('meta', JSON.stringify(meta));
const saveCards = () => store.set('cards', JSON.stringify(cards));
const saveBudgets = () => store.set('budgets', JSON.stringify(budgets));
const saveGoals = () => store.set('goals', JSON.stringify(goals));
const saveRecur = () => store.set('recur', JSON.stringify(recur));

async function saveOps(fromIdx) {
  const first = Math.max(0, Math.floor(fromIdx / CHUNK));
  const newN = Math.ceil(ops.length / CHUNK);
  const jobs = [];
  for (let i = first; i < newN; i++)
    jobs.push(store.set('o' + i, JSON.stringify(ops.slice(i * CHUNK, (i + 1) * CHUNK).map(pack))));
  for (let i = newN; i < meta.n; i++) jobs.push(store.del('o' + i));
  meta.n = newN;
  jobs.push(saveMeta());
  await Promise.all(jobs);
}
const sortOps = () => ops.sort((a, b) => a.t - b.t || a.id - b.id);
async function addOp(o) { o.id = meta.next++; ops.push(o); sortOps(); await saveOps(ops.indexOf(o)); }
async function updateOp(id, patch) {
  const o = ops.find(x => x.id === id); const before = ops.indexOf(o);
  Object.assign(o, patch); sortOps();
  await saveOps(Math.min(before, ops.indexOf(o)));
}
async function deleteOp(id) {
  const i = ops.findIndex(o => o.id === id); if (i < 0) return;
  ops.splice(i, 1); await saveOps(i);
}

function balance(cardId) {
  const c = cards.find(x => x.id === cardId);
  let b = c ? c.start : 0;
  for (const o of ops) {
    if (o.f === cardId) {
      if (o.k === 'e' || o.k === 't' || o.k === 'g') b -= o.a;
      else b += o.a; // i, a
    }
    if (o.k === 't' && o.to === cardId) b += (o.a2 != null ? o.a2 : o.a);
  }
  return b;
}
function goalSaved(g) {
  return ops.reduce((s, o) => o.k === 'g' && o.to === g.id ? s + o.a2 : s, g.start || 0);
}

/* ================================================================ Валюты */
const cardCur = id => (cards.find(c => c.id === id) || { cur: meta.base }).cur;
const hasRate = c => c === 'USD' || !!meta.rates[c];
function conv(v, from, to = meta.base) {
  if (from === to) return v;
  const r = Object.assign({ USD: 1 }, meta.rates);
  if (!r[from] || !r[to]) return v;
  return Math.round(v / r[from] * r[to]);
}
const opBase = o => conv(o.a, cardCur(o.f));
async function refreshRates(force) {
  if (!force && Date.now() - meta.ratesAt < 6 * 3600e3) return false;
  try {
    const r = await fetch('https://open.er-api.com/v6/latest/USD').then(x => x.json());
    if (r.result !== 'success') throw 0;
    meta.rates = {};
    Object.keys(CURS).forEach(k => { if (r.rates[k]) meta.rates[k] = r.rates[k]; });
    meta.ratesAt = Date.now();
    await saveMeta();
    return true;
  } catch (e) { return false; }
}

/* ================================================================ Утилиты */
const $ = s => document.querySelector(s);
const $$ = s => document.querySelectorAll(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
function fmtNum(v) {
  const neg = v < 0; v = Math.abs(v);
  let s = Math.floor(v / 100).toString().replace(/\B(?=(\d{3})+(?!\d))/g, ' ');
  if (v % 100) s += ',' + String(v % 100).padStart(2, '0');
  return (neg ? '−' : '') + s;
}
function money(v, sign, cur = meta.base) {
  return (sign && v > 0 ? '+' : '') + fmtNum(v) + ' ' + sym(cur);
}
const cmoney = (v, cardId, sign) => money(v, sign, cardCur(cardId));
const hm = (v, cur) => meta.hide ? '••••• ' + sym(cur || meta.base) : money(v, false, cur); // скрываемые балансы
const toInput = v => (v / 100).toFixed(2).replace(/\.00$/, '').replace('.', ',');
function parseMoney(s) {
  s = String(s).replace(/[\s  ]/g, '').replace(',', '.');
  if (!/^\d+(\.\d{0,2})?$/.test(s)) return null;
  return Math.round(parseFloat(s) * 100);
}
function catInfo(name, kind) {
  const list = kind === 'i' ? INC_CATS : EXP_CATS;
  const f = list.find(c => c[0] === name);
  return f ? { e: f[1], col: f[2] } : { e: '🏷️', col: '#94a3b8' };
}
const tint = col => `background:color-mix(in srgb, ${col} 16%, var(--bg))`;
const cardName = id => (cards.find(c => c.id === id) || { name: 'удалена' }).name;
const goalById = id => goals.find(g => g.id === id);
const ym = t => { const d = new Date(t * 1000); return d.getFullYear() * 12 + d.getMonth(); };
const nowYm = () => ym(Date.now() / 1000);
const MONTHS = ['Январь','Февраль','Март','Апрель','Май','Июнь','Июль','Август','Сентябрь','Октябрь','Ноябрь','Декабрь'];
const MONTHS_G = ['января','февраля','марта','апреля','мая','июня','июля','августа','сентября','октября','ноября','декабря'];
const MONTHS_S = ['янв','фев','мар','апр','мая','июн','июл','авг','сен','окт','ноя','дек'];
const isoDay = d => { const x = new Date(d); x.setMinutes(x.getMinutes() - x.getTimezoneOffset()); return x.toISOString().slice(0, 10); };
const dayDiff = iso => Math.round((new Date(iso + 'T00:00') - new Date(isoDay(new Date()) + 'T00:00')) / 864e5);
function dayLabel(t) {
  const d = new Date(t * 1000), diff = dayDiff(isoDay(d));
  if (diff === 0) return 'Сегодня';
  if (diff === -1) return 'Вчера';
  const wd = ['вс','пн','вт','ср','чт','пт','сб'][d.getDay()];
  return d.getDate() + ' ' + MONTHS_G[d.getMonth()] + (d.getFullYear() !== new Date().getFullYear() ? ' ' + d.getFullYear() : '') + ', ' + wd;
}
const shortDate = iso => { const d = new Date(iso + 'T00:00'); return d.getDate() + ' ' + MONTHS_G[d.getMonth()]; };
function haptic(t) { try { t === 'tap' ? tg.HapticFeedback.selectionChanged() : tg.HapticFeedback.notificationOccurred(t); } catch (e) {} }
function toast(msg) {
  const t = $('#toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(toast.h); toast.h = setTimeout(() => t.classList.remove('show'), 2000);
}
function confirmBox(text) {
  return new Promise(res => (CLOUD && tg.showConfirm) ? tg.showConfirm(text, ok => res(ok)) : res(confirm(text)));
}
const monthSum = (m, kind) => ops.reduce((s, o) => o.k === kind && ym(o.t) === m ? s + opBase(o) : s, 0);

/* ================================================================ Строка операции */
function opRow(o) {
  let ic, col = '#94a3b8', t1, t2, amt, cls = '', sub = '';
  if (o.k === 'e' || o.k === 'i') {
    const ci = catInfo(o.c, o.k); ic = ci.e; col = ci.col; t1 = o.c; t2 = cardName(o.f);
    amt = cmoney(o.k === 'e' ? -o.a : o.a, o.f, true); if (o.k === 'i') cls = 'in';
  } else if (o.k === 't') {
    ic = '🔁'; col = '#3b82f6'; t1 = 'Перевод'; t2 = cardName(o.f) + ' → ' + cardName(o.to); amt = cmoney(o.a, o.f);
    if (o.a2 != null && cardCur(o.to) !== cardCur(o.f)) sub = cmoney(o.a2, o.to);
  } else if (o.k === 'g') {
    const g = goalById(o.to); ic = g ? g.emoji : '🐷'; col = g ? g.color : '#ec4899';
    t1 = (o.a >= 0 ? 'В копилку ' : 'Из копилки ') + (g ? g.name : ''); t2 = cardName(o.f); amt = cmoney(-o.a, o.f, true);
    if (o.a < 0) cls = 'in';
  } else { ic = '✏️'; t1 = 'Корректировка'; t2 = cardName(o.f); amt = cmoney(o.a, o.f, true); cls = o.a > 0 ? 'in' : ''; }
  if (o.n) t2 = o.n + ' · ' + t2;

function dueRow(r) {

  const qNum = parseMoney(q);
  const list = ops.filter(o => {
    if (hKind !== 'all' && o.k !== hKind) return false;
    if (hCard && o.f !== hCard && o.to !== hCard) return false;
    if (q) {
      const hay = [o.c, o.n, cardName(o.f), o.k === 't' ? 'перевод ' + cardName(o.to) : '', o.k === 'g' && goalById(o.to) ? goalById(o.to).name : '']

    html += `<div class="day"><span>${dayLabel(group[0].t)}</span><span class="num">${sp ? money(-sp) : ''}</span></div>
      <div class="box" style="padding:4px 16px;margin-bottom:0">${group.map(opRow).join('')}</div>`;

  flush();
  $('#history').innerHTML = html;
}

  list.forEach(o => { days[new Date(o.t * 1000).getDate() - 1] += opBase(o); });

  $('#s-line').innerHTML = (sKind === 'e' ? `<span>В среднем: <b class="num">${money(Math.round(total / daysPassed))}</b>/день</span>` : '')

  // График по дням (одна серия — без легенды; значения в подсказке)

  let svg = '';
  if (sKind === 'e' && budgets['*']) {
    const avgAllowed = budgets['*'] / dim, yy = H - Math.min(1, avgAllowed / Math.max(maxDay, avgAllowed)) * (H - 6);
    svg += `<line x1="0" x2="${W}" y1="${yy}" y2="${yy}" stroke="var(--hint)" stroke-width="1" stroke-dasharray="3 3" vector-effect="non-scaling-stroke"/>`;
  }
  const top = Math.max(maxDay, sKind === 'e' && budgets['*'] ? budgets['*'] / dim : 0) || 1;
  days.forEach((v, i) => {
    const x = i * (bw + gap), h = v ? Math.max(3, v / top * (H - 6)) : 2;
    const today = isCur && i === new Date().getDate() - 1;
    svg += `<rect x="${x}" y="${H - h}" width="${bw}" height="${h}" rx="${Math.min(2, bw / 2)}" fill="${v ? color : 'var(--line)'}" opacity="${v && !today && isCur && i > new Date().getDate() - 1 ? .35 : 1}"/>`;
    svg += `<rect x="${x - gap / 2}" y="0" width="${bw + gap}" height="${H}" fill="transparent" data-day="${i}"/>`;
  });
  const s = $('#chart-svg'); s.setAttribute('viewBox', `0 0 ${W} ${H}`); s.innerHTML = svg;
  s.onpointermove = s.onpointerdown = e => {
    const d = e.target.dataset && e.target.dataset.day; if (d == null) return;
    const tip = $('#tip'), i = +d;

    tip.style.left = Math.max(50, Math.min(rect.width - 50, x)) + 'px'; tip.classList.add('show');
  };
  s.onpointerleave = () => $('#tip').classList.remove('show');
  $('#axis').innerHTML = `<span>1</span><span>${Math.ceil(dim / 2)}</span><span>${dim}</span>`;

  // Категории
  const byCat = {}, byCard = {};
  list.forEach(o => { const v = opBase(o); byCat[o.c] = (byCat[o.c] || 0) + v; byCard[o.f] = (byCard[o.f] || 0) + v; });
  const cats = Object.entries(byCat).sort((a, b) => b[1] - a[1]);
  $('#s-cats').innerHTML = cats.length ? cats.map(([k, v]) => {
    const ci = catInfo(k, sKind), lim = sKind === 'e' && budgets[k];
    const pct = Math.round(v * 100 / total);
    const cls = lim ? (v >= lim ? 'over' : v >= lim * .8 ? 'warn' : '') : '';
    return `<div class="brow"><div class="r1"><div class="ic" style="${tint(ci.col)}">${ci.e}</div>
      <div class="nm">${esc(k)}</div><div class="vl num">${money(v)}<small>${pct}%${lim ? ' · лимит ' + money(lim) : ''}</small></div></div>
      <div class="track"><div class="fill ${cls}" style="width:${lim ? Math.min(100, v * 100 / lim) : v * 100 / cats[0][1]}%;${cls ? '' : 'background:' + ci.col}"></div></div></div>`;
  }).join('') : `<div class="empty">${sKind === 'e' ? 'Трат' : 'Доходов'} за этот месяц нет</div>`;
  const cl = Object.entries(byCard).sort((a, b) => b[1] - a[1]);
  $('#s-cards').innerHTML = cl.length ? cl.map(([id, v]) => {
    const c = cards.find(x => x.id === +id) || { color: '#94a3b8', name: 'удалена' };
    return `<div class="brow"><div class="r1"><div class="ic" style="background:${c.color};color:#fff">💳</div>
      <div class="nm">${esc(c.name)}</div><div class="vl num">${money(v)}<small>${Math.round(v * 100 / total)}%</small></div></div>
      <div class="track"><div class="fill" style="width:${v * 100 / cl[0][1]}%;background:${c.color}"></div></div></div>`;
  }).join('') : '<div class="empty">Нет данных</div>';
}

/* ---------- Калькулятор */
function evalExpr(s) {
  const tk = s.match(/\d+(?:\.\d*)?|\.\d+|[+\-×÷]/g) || [];
  while (tk.length && /^[+\-×÷]$/.test(tk[tk.length - 1])) tk.pop();
  if (!tk.length) return 0;
  if (/^[+\-×÷]$/.test(tk[0])) tk.unshift('0');
  const a = [parseFloat(tk[0])];
  for (let i = 1; i < tk.length; i += 2) {
    const op = tk[i], n = parseFloat(tk[i + 1]);
    if (op === '×') a[a.length - 1] *= n;
    else if (op === '÷') a[a.length - 1] = n ? a[a.length - 1] / n : NaN;
    else a.push(op === '-' ? -n : n);
  }
  const r = a.reduce((x, y) => x + y, 0);
  return isFinite(r) ? Math.round(r * 100) : null;
}
const prettyExpr = s => s.replace(/\d+/g, d => d.replace(/\B(?=(\d{3})+(?!\d))/g, ' ')).replace(/\./g, ',').replace(/([+\-×÷])/g, ' $1 ');
let keyHandler = null;
document.addEventListener('keydown', e => { if (keyHandler && !/INPUT|TEXTAREA/.test(document.activeElement.tagName)) keyHandler(e); });

      $('#a-goal-w').innerHTML = goals.map(g => `<button class="chip ${st.to === g.id ? 'on' : ''}" data-goal="${g.id}">${g.emoji} ${esc(g.name)}</button>`).join('');
      $$('#a-dir-w button').forEach(b => b.classList.toggle('on', +b.dataset.d === st.dir));
      // перевод между разными валютами
      const toCur = st.k === 't' ? cardCur(st.to) : st.k === 'g' && goalById(st.to) ? goalById(st.to).cur : null;
      const fx = toCur && toCur !== fromCur();
      $('#a-a2-w').style.display = fx ? '' : 'none';
      if (fx) {
        $('#a-a2-l').textContent = (st.k === 't' ? 'Зачислится, ' : 'В копилке, ') + sym(toCur);
        if (!a2edited) $('#a-a2').value = v ? toInput(conv(v, fromCur(), toCur)) : '';
      }
      $('#a-date').value = st.date;
      $('#a-date-l').textContent = dayDiff(st.date) === 0 ? 'Сегодня' : dayDiff(st.date) === -1 ? 'Вчера' : shortDate(st.date);
    };
    $('#a-note').value = st.n;
    if (edit && edit.a2 != null) $('#a-a2').value = toInput(Math.abs(edit.a2));
    draw();

    const press = v => {
      haptic('tap');
      const isOp = /^[+\-×÷]$/.test(v);
      if (v === 'del') st.expr = st.expr.slice(0, -1);
      else if (isOp) { if (!st.expr) return; st.expr = /[+\-×÷]$/.test(st.expr) ? st.expr.slice(0, -1) + v : st.expr + v; }
      else if (v === '.') { const last = st.expr.split(/[+\-×÷]/).pop(); if (last.includes('.')) return; st.expr += last ? '.' : '0.'; }
      else { const last = st.expr.split(/[+\-×÷]/).pop(); if (/\.\d\d$/.test(last) || last.replace('.', '').length >= 11) return;
             st.expr = (last === '0' ? st.expr.slice(0, -1) : st.expr) + v; }
      $('#a-err').textContent = ''; draw();
    };
    $('#kp').onclick = e => { const b = e.target.closest('button'); if (b) press(b.dataset.v || b.textContent); };
    keyHandler = e => {
      const map = { '*': '×', '/': '÷', ',': '.', Backspace: 'del' };
      const k = map[e.key] || e.key;
      if (/^[0-9.+\-×÷]$/.test(k) || k === 'del') { e.preventDefault(); press(k); }
      else if (e.key === 'Enter') { e.preventDefault(); $('#a-save').click(); }
    };
    $('#a-seg').onclick = e => { const k = e.target.dataset.k; if (!k) return;
      if (k === 'g' && !goals.length) { openGoal(null, () => openAdd('g')); return; }
      st.k = k; st.c = null; a2edited = false; $('#a-newcat').style.display = 'none';
      if (k === 't') st.to = (cards.find(c => c.id !== st.f) || cards[0]).id;
      if (k === 'g') st.to = goals[0].id;
      draw(); };
    $('#a-cats').onclick = e => {
      const b = e.target.closest('[data-cat]'); if (!b) return; haptic('tap');
      const inp = $('#a-newcat');
      if (b.dataset.cat === '__new') { st.c = null; draw(); inp.style.display = ''; inp.value = ''; inp.focus(); return; }
      inp.style.display = 'none'; st.c = b.dataset.cat; draw();
    };
    $('#a-newcat').oninput = e => { st.c = e.target.value.trim() || null; };
    $('#a-from').onclick = e => { const b = e.target.closest('[data-id]'); if (!b) return; st.f = +b.dataset.id;
      if (st.to === st.f && st.k === 't') st.to = (cards.find(c => c.id !== st.f) || cards[0]).id; a2edited = false; draw(); };
    $('#a-to').onclick = e => { const b = e.target.closest('[data-id]'); if (b) { st.to = +b.dataset.id; a2edited = false; draw(); } };
    $('#a-goal-w').onclick = e => { const b = e.target.closest('[data-goal]'); if (b) { st.to = +b.dataset.goal; a2edited = false; draw(); } };
    $('#a-dir-w').onclick = e => { const b = e.target.closest('[data-d]'); if (b) { st.dir = +b.dataset.d; draw(); } };
    $('#a-a2').oninput = () => { a2edited = true; };
    $('#a-date').onchange = e => { if (e.target.value) { st.date = e.target.value; draw(); } };
    $('#a-note').oninput = e => { st.n = e.target.value; };

    if (edit) $('#a-del').onclick = async () => {
      if (!(await confirmBox('Удалить операцию? Баланс карты пересчитается.'))) return;
      await deleteOp(edit.id); haptic('warning'); closeAll(); render(); toast('Удалено');
    };
    $('#a-save').onclick = async () => {
      const a = amount();
      const err = m => { $('#a-err').textContent = m; haptic('error'); };
      if (a == null) return err('Ошибка в выражении');
      if (a <= 0) return err('Введите сумму');
      if ((st.k === 'e' || st.k === 'i') && !st.c) return err('Выберите категорию');
      if (st.k === 't' && st.f === st.to) return err('Выберите две разные карты');
      let a2;
      if ($('#a-a2-w').style.display !== 'none') { a2 = parseMoney($('#a-a2').value); if (!a2) return err('Укажите сумму зачисления'); }
      else if (st.k === 'g') a2 = a;
      const now = new Date(), d = new Date(st.date + 'T00:00');
      if (edit && isoDay(edit.t * 1000) === st.date) d.setTime(edit.t * 1000);
      else d.setHours(now.getHours(), now.getMinutes(), now.getSeconds());
      if (st.k === 'e' || st.k === 'i') {
        const found = cats().find(x => x[0].toLowerCase() === st.c.toLowerCase());
        if (found) st.c = found[0]; else (st.k === 'i' ? meta.icats : meta.cats).push(st.c);
      }
      const o = { t: Math.floor(d.getTime() / 1000), k: st.k, a: st.k === 'g' ? a * st.dir : a,
        c: st.k === 'e' || st.k === 'i' ? st.c : '', f: st.f, to: st.k === 't' || st.k === 'g' ? st.to : 0,
        a2: a2 != null ? (st.k === 'g' ? a2 * st.dir : a2) : undefined, n: st.n.trim() };
      $('#a-save').disabled = true;
      try {
        if (edit) await updateOp(edit.id, o); else await addOp(o);
        if (preset.recurId) { const r = recur.find(x => x.id === preset.recurId); if (r) { r.next = nextDate(r.next, r.per); await saveRecur(); } }
        haptic('success'); closeAll(); render();
        if (edit) toast('Изменено');
        else if (st.k === 'g') { const g = goalById(st.to); toast(`${g.emoji} ${g.name}: ${money(goalSaved(g), false, g.cur)}`); }
        else if (st.k === 't') toast('Перевод сохранён');
        else toast(`${cardName(st.f)}: ${hm(balance(st.f), fromCur())}`);
        if (st.k === 'e' && !edit) budgetAlert(st.c);
      } catch (e) { $('#a-save').disabled = false; err('Не удалось сохранить, попробуйте ещё раз'); }
    };
  });
}

function budgetAlert(cat) {
  const m = nowYm();
  const check = (k, lim) => {
    const sp = ops.reduce((s, o) => o.k === 'e' && ym(o.t) === m && (k === '*' || o.c === k) ? s + opBase(o) : s, 0);
    if (sp >= lim) return `⚠️ Бюджет «${k === '*' ? 'Все расходы' : k}» превышен`;
    if (sp >= lim * .8) return `Бюджет «${k === '*' ? 'Все расходы' : k}»: потрачено ${Math.round(sp * 100 / lim)}%`;
  };
  const msg = (budgets[cat] && check(cat, budgets[cat])) || (budgets['*'] && check('*', budgets['*']));
  if (msg) setTimeout(() => { toast(msg); haptic('warning'); }, 2100);
}

/* ---------- Карта */
function openCard(id, back) {
  const c = cards.find(x => x.id === id);
  let color = c ? c.color : COLORS[(cards.length * 3 + 5) % COLORS.length];
  let ccur = c ? c.cur : meta.base;
  openSheet(`
    <h2>${c ? 'Карта' : 'Новая карта'}</h2>
    <div class="card" id="c-prev" style="width:100%;flex:none;height:120px;margin-bottom:16px"></div>
    <div class="field"><label>Название</label><input class="inp" id="c-name" maxlength="24" placeholder="Kaspi Gold" value="${c ? esc(c.name) : ''}"></div>
    <div class="field"><label>${c ? 'Сейчас на карте' : 'Текущий баланс'}</label>
      <input class="inp" id="c-bal" inputmode="decimal" placeholder="0" value="${c ? toInput(balance(c.id)) : ''}"></div>
    <div class="field"><label>Валюта${c ? ' (менять нельзя — старые операции посчитаются неверно)' : ''}</label><div class="chips" id="c-cur"></div></div>
    <div class="field"><label>Цвет</label><div class="colors" id="c-colors"></div></div>
    <div class="err" id="c-err"></div>
    <button class="btn" id="c-save">Сохранить</button>
    ${c ? '<button class="btn del" id="c-del" style="margin-top:8px">Удалить карту</button>' : ''}`, () => {
    const prev = () => {
      const p = $('#c-prev');
      p.style.background = `linear-gradient(135deg, ${color}, ${GRADS[color] || color})`;
      const raw = $('#c-bal').value.trim(), v = parseMoney(raw.replace(/^[-−]/, ''));
      p.innerHTML = `<div class="ct"><span class="cn">${esc($('#c-name').value || 'Название карты')}</span><span class="cc">${ccur}</span></div>
        <div class="cb num">${money((v || 0) * (/^[-−]/.test(raw) ? -1 : 1), false, ccur)}</div>`;
    };
    const drawC = () => { $('#c-colors').innerHTML = COLORS.map(x =>
      `<button style="background:linear-gradient(135deg, ${x}, ${GRADS[x]})" class="${x === color ? 'on' : ''}" data-color="${x}"></button>`).join(''); prev(); };
    const drawCur = () => { $('#c-cur').innerHTML = (c ? [ccur] : Object.keys(CURS)).map(k =>
      `<button class="chip ${k === ccur ? 'on' : ''}" data-cur="${k}">${sym(k)} ${CURS[k][1]}</button>`).join(''); prev(); };
    drawC(); drawCur();
    $('#c-colors').onclick = e => { if (e.target.dataset.color) { color = e.target.dataset.color; drawC(); } };
    $('#c-cur').onclick = e => { const b = e.target.closest('[data-cur]'); if (b && !c) { ccur = b.dataset.cur; drawCur(); } };
    $('#c-name').oninput = $('#c-bal').oninput = prev;
    if (!c) setTimeout(() => $('#c-name').focus(), 300);
    $('#c-save').onclick = async () => {
      const name = $('#c-name').value.trim(), raw = $('#c-bal').value.trim();
      const neg = /^[-−]/.test(raw); let bal = raw ? parseMoney(raw.replace(/^[-−]/, '')) : 0;
      if (!name) return ($('#c-err').textContent = 'Введите название');
      if (bal === null) return ($('#c-err').textContent = 'Неверная сумма');
      if (neg) bal = -bal;
      if (c) {
        c.name = name; c.color = color;
        const diff = bal - balance(c.id);
        if (diff) await addOp({ t: Math.floor(Date.now() / 1000), k: 'a', a: diff, c: '', f: c.id, to: 0 });
      } else {
        cards.push({ id: meta.next++, name, start: bal, color, cur: ccur });
        await saveMeta();
        if (ccur !== meta.base) refreshRates().then(ok => ok && render());
      }
      await saveCards(); haptic('success');
      if (back) back(); else closeAll();
      render();
    };
    if (c) $('#c-del').onclick = async () => {
      if (!(await confirmBox(`Удалить «${c.name}»? Операции по ней останутся в истории.`))) return;
      cards = cards.filter(x => x.id !== c.id); await saveCards();
      if (back) back(); else closeAll();
      render();
    };
  }, back);
}

/* ---------- Детали операции */
function openOp(id) {
  const o = ops.find(x => x.id === id); if (!o) return;
  if (o.k === 'a') {
    return confirmBox('Удалить корректировку баланса?').then(async ok => {
      if (ok) { await deleteOp(id); render(); toast('Удалено'); } });
  }
  openAdd(o.k, o);
}

/* ---------- Валюта */
function openCurrency() {
  const used = [...new Set(cards.map(c => c.cur).concat(goals.map(g => g.cur)))];
  let base = meta.base;
  const R = () => Object.assign({ USD: 1 }, meta.rates);
  const rateStr = c => { const r = R(); if (!r[c] || !r[base]) return '';
    const x = r[base] / r[c]; return (+x.toPrecision(x >= 1 ? 6 : 4)).toString().replace('.', ','); };
  const ratesHtml = () => {
    const others = used.filter(c => c !== base);
    if (!others.length) return '<div class="muted" style="font-size:13.5px;padding:4px 0 12px">Все счета в основной валюте — курсы не нужны</div>';
    return others.map(c => `<div class="field"><label>1 ${sym(c)} (${CURS[c][1]}) =</label>
      <input class="inp" inputmode="decimal" data-rate="${c}" value="${rateStr(c)}" placeholder="курс в ${sym(base)}" style="background:var(--bg)"></div>`).join('');
  };
  openSheet(`<h2>Валюта и курсы</h2>
    <div class="field"><label>Основная валюта — в ней считаются общий баланс, бюджеты и аналитика</label>
      <div class="chips" id="cu-base"></div></div>
    <div class="box" style="background:var(--bg2);box-shadow:none;padding:14px 14px 2px">
      <div style="font-weight:600;margin-bottom:10px">Курсы <span class="muted" id="cu-at" style="font-weight:400;font-size:13px"></span></div>
      <div id="cu-rates"></div></div>
    <div class="err" id="cu-err"></div>
    <button class="btn" id="cu-save">Сохранить</button>
    <button class="btn sec" id="cu-upd" style="margin-top:8px">🔄 Обновить курсы</button>`, () => {
    const draw = () => {
      $('#cu-base').innerHTML = Object.keys(CURS).map(k =>
        `<button class="chip ${k === base ? 'on' : ''}" data-cur="${k}">${sym(k)} ${CURS[k][1]}</button>`).join('');
      $('#cu-rates').innerHTML = ratesHtml();
      $('#cu-at').textContent = meta.ratesAt ? '· обновлены ' + new Date(meta.ratesAt).toLocaleString('ru-RU', { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' }) : '';
    };
    draw();
    $('#cu-base').onclick = e => { const b = e.target.closest('[data-cur]'); if (b) { base = b.dataset.cur; draw(); } };
    $('#cu-upd').onclick = async () => {
      $('#cu-upd').disabled = true; const ok = await refreshRates(true); $('#cu-upd').disabled = false;
      draw(); toast(ok ? 'Курсы обновлены' : 'Нет связи — введите курс вручную');
    };
    $('#cu-save').onclick = async () => {
      const r = R(); if (!r[base]) r[base] = 1;
      for (const inp of $$('[data-rate]')) {
        const v = inp.value.trim();
        if (!v || v === rateStr(inp.dataset.rate)) continue;
        const x = parseFloat(v.replace(/\s/g, '').replace(',', '.'));
        if (!(x > 0)) return ($('#cu-err').textContent = 'Неверный курс: ' + CURS[inp.dataset.rate][1]);
        r[inp.dataset.rate] = r[base] / x;
      }
      if (base !== meta.base) {  // бюджеты хранятся в основной валюте — пересчитываем
        const nb = {}; Object.keys(budgets).forEach(k => nb[k] = conv(budgets[k], meta.base, base));
        budgets = nb; await saveBudgets();
      }
      meta.rates = r; meta.base = base;
      await saveMeta(); haptic('success'); closeAll(); render();
    };
  });
}

/* ---------- Бюджеты */
function openBudgets() {
  const m = nowYm(), spent = {}; let all = 0;
  ops.forEach(o => { if (o.k === 'e' && ym(o.t) === m) { const v = opBase(o); spent[o.c] = (spent[o.c] || 0) + v; all += v; } });
  const keys = Object.keys(budgets).sort((a, b) => a === '*' ? -1 : b === '*' ? 1 : 0);
  openSheet(`<h2>Бюджеты на ${MONTHS[m % 12].toLowerCase()}</h2>
    <div class="muted" style="font-size:13.5px;margin:-6px 0 12px">Лимиты в ${sym(meta.base)}, обнуляются каждый месяц. Нажмите, чтобы изменить.</div>
    <div id="bl">${keys.length ? keys.map(k => `<div data-b="${esc(k)}" style="cursor:pointer">${budgetRow({ k, lim: budgets[k], sp: k === '*' ? all : (spent[k] || 0) })}</div>`).join('')
      : '<div class="empty">Бюджетов пока нет.<br>Начните с общего лимита на месяц.</div>'}</div>
    <button class="btn" id="b-add" style="margin-top:12px">＋ Добавить лимит</button>`, () => {
    $('#bl').onclick = e => { const b = e.target.closest('[data-b]'); if (b) openBudget(b.dataset.b); };
    $('#b-add').onclick = () => openBudget(null);
  });
}
function openBudget(key) {
  let cat = key || (budgets['*'] ? null : '*');
  const avg3 = k => { const m = nowYm(); let s = 0; for (let i = 1; i <= 3; i++) s += ops.reduce((x, o) => o.k === 'e' && ym(o.t) === m - i && (k === '*' || o.c === k) ? x + opBase(o) : x, 0); return Math.round(s / 3); };
  const opts = [['*', '💰', '#6366f1', 'Все расходы'], ...EXP_CATS.map(c => [c[0], c[1], c[2], c[0]]), ...meta.cats.map(c => [c, '🏷️', '#94a3b8', c])];
  openSheet(`<h2>${key ? 'Лимит' : 'Новый лимит'}</h2>
    <div class="field"><label>Категория</label><div class="cats" id="bd-cats" style="margin-bottom:0"></div></div>
    <div class="field"><label>Лимит на месяц, ${sym(meta.base)}</label><input class="inp" id="bd-lim" inputmode="decimal" placeholder="0" value="${key ? toInput(budgets[key]) : ''}"></div>
    <div class="muted" id="bd-hint" style="font-size:13px;margin:-6px 2px 12px"></div>
    <div class="err" id="bd-err"></div>
    <button class="btn" id="bd-save">Сохранить</button>
    ${key ? '<button class="btn del" id="bd-del" style="margin-top:8px">Удалить лимит</button>' : ''}`, () => {
    const draw = () => {
      $('#bd-cats').innerHTML = opts.filter(o => key ? o[0] === key : !budgets[o[0]]).map(([k, e, col, n]) =>
        `<button class="cat ${cat === k ? 'on' : ''}" data-k="${esc(k)}"><span class="ic" style="${tint(col)}">${e}</span><span>${esc(n)}</span></button>`).join('');
      const a = cat ? avg3(cat) : 0;
      $('#bd-hint').innerHTML = a ? `В среднем за 3 месяца: <b>${money(a)}</b> · <a href="#" id="bd-use" style="color:var(--accent)">подставить</a>` : '';
      const u = $('#bd-use'); if (u) u.onclick = e => { e.preventDefault(); $('#bd-lim').value = toInput(Math.ceil(a / 100000) * 100000); };
    };
    draw();
    $('#bd-cats').onclick = e => { const b = e.target.closest('[data-k]'); if (b && !key) { cat = b.dataset.k; draw(); } };
    $('#bd-save').onclick = async () => {
      const v = parseMoney($('#bd-lim').value);
      if (!cat) return ($('#bd-err').textContent = 'Выберите категорию');
      if (!v) return ($('#bd-err').textContent = 'Введите сумму');
      budgets[cat] = v; await saveBudgets(); haptic('success'); render(); openBudgets();
    };
    if (key) $('#bd-del').onclick = async () => { delete budgets[key]; await saveBudgets(); render(); openBudgets(); };
  }, openBudgets);
}

function nextDate(iso, per) {
  const d = new Date(iso + 'T00:00'), day = d.getDate();
  if (per === 'w') d.setDate(d.getDate() + 7);
  else if (per === 'y') d.setFullYear(d.getFullYear() + 1);
  else { d.setDate(1); d.setMonth(d.getMonth() + 1); d.setDate(Math.min(day, new Date(d.getFullYear(), d.getMonth() + 1, 0).getDate())); }
  return isoDay(d);
}

const bm = () => tg && tg.isVersionAtLeast && tg.isVersionAtLeast('7.2') && tg.BiometricManager;
let bioReady = false;
function initBio() {
  return new Promise(res => { const b = bm(); if (!b) return res(false);
    try { b.init(() => { bioReady = b.isInited && b.isBiometricAvailable; res(bioReady); }); } catch (e) { res(false); } });
}
const bioName = () => { const t = bm() && bm().biometricType; return t === 'face' ? 'Face ID' : t === 'finger' ? 'отпечаток' : 'биометрия'; };
const bioIcon = () => (bm() && bm().biometricType === 'face') ? '🙂' : '👆';
function bioAuth() {
  return new Promise(res => { const b = bm(); if (!b || !bioReady) return res(false);
    const go = () => b.authenticate({ reason: 'Вход в Финансы' }, ok => res(!!ok));
    if (b.isAccessGranted) go();
    else b.requestAccess({ reason: 'Чтобы входить в Финансы без кода' }, ok => ok ? go() : res(false));
  });
}
async function hashPin(pin, salt) {
  const data = new TextEncoder().encode(salt + ':' + pin);
  if (crypto.subtle) {
    let buf = data;
    for (let i = 0; i < 2000; i++) buf = new Uint8Array(await crypto.subtle.digest('SHA-256', buf));
    return Array.from(buf, b => b.toString(16).padStart(2, '0')).join('');
  }
  let h = 0; for (const b of data) h = (h * 31 + b) >>> 0; return 'x' + h; // запасной вариант без WebCrypto
}
const newSalt = () => Array.from(crypto.getRandomValues(new Uint8Array(12)), b => b.toString(16).padStart(2, '0')).join('');

// Универсальный ввод 4 цифр на экране блокировки
let pinCb = null, pinBuf = '';
function showPad({ title, sub = '', icon = '🔒', bio = false, forgot = false, cancel = null }, cb) {
  pinBuf = ''; pinCb = cb;
  $('#lock-title').textContent = title; $('#lock-sub').textContent = sub; $('#lock-logo').textContent = icon;
  const bb = $('#bio-btn');
  bb.textContent = cancel ? '✕' : bio ? bioIcon() : ''; bb.disabled = !(cancel || bio);
  bb.dataset.v = cancel ? 'cancel' : 'bio'; showPad.cancel = cancel;
  $('#lock-forgot').style.display = forgot ? '' : 'none';
  drawDots(); $('#lock').classList.add('show'); document.body.classList.add('locked');
  if (tg && tg.BackButton) tg.BackButton.hide();
}
function hidePad() { $('#lock').classList.remove('show'); document.body.classList.remove('locked'); pinCb = null; }
function drawDots() { $$('#lock-dots i').forEach((d, i) => d.classList.toggle('on', i < pinBuf.length)); }
function padError(msg) {
  pinBuf = ''; drawDots(); $('#lock-sub').textContent = msg; haptic('error');
  const d = $('#lock-dots'); d.classList.remove('shake'); void d.offsetWidth; d.classList.add('shake');
}
function padPress(v) {
  if (!pinCb) return;
  if (v === 'cancel') { const c = showPad.cancel; hidePad(); return c && c(); }
  if (v === 'bio') return unlockBio();
  if (v === 'del') { pinBuf = pinBuf.slice(0, -1); return drawDots(); }
  if (pinBuf.length >= 4 || Date.now() < (lockUntil || 0)) return;
  haptic('tap'); pinBuf += v; drawDots();
  if (pinBuf.length === 4) { const p = pinBuf, cb = pinCb; setTimeout(() => cb(p), 120); }
}
$('#pinpad').onclick = e => { const b = e.target.closest('button'); if (b && !b.disabled) padPress(b.dataset.v || b.textContent); };
document.addEventListener('keydown', e => {
  if (!pinCb) return;
  if (/^\d$/.test(e.key)) padPress(e.key); else if (e.key === 'Backspace') padPress('del');
});

let fails = 0, lockUntil = 0, onUnlock = null;
function lockApp() {
  if (!meta.pin || $('#lock').classList.contains('show')) return;
  closeAll();
  showPad({ title: 'Введите код-пароль', bio: meta.bio && bioReady, forgot: true }, async p => {
    if (await hashPin(p, meta.pin.salt) === meta.pin.hash) return unlocked();
    fails++;
    if (fails >= 5) {
      lockUntil = Date.now() + 30000; padError('Слишком много попыток. Подождите 30 секунд');
      setTimeout(() => { fails = 0; $('#lock-sub').textContent = ''; }, 30000);
    } else padError(`Неверный код. Осталось попыток: ${5 - fails}`);
  });
  if (meta.bio && bioReady) setTimeout(unlockBio, 350);
}

}

  showPad({ title: required ? 'Защитите свои финансы' : 'Придумайте код-пароль',
            sub: required ? 'Придумайте код из 4 цифр — он понадобится при каждом входе' : '4 цифры', icon: '🔐', cancel }, first => {
    showPad({ title: 'Повторите код', sub: 'Чтобы не ошибиться', icon: '🔐', cancel }, async second => {
      if (first !== second) { hidePad(); toast('Коды не совпали, попробуйте ещё раз'); return setupPin(done, required); }

// Сжимаем скриншот; очень длинные (прокрученные) режем на части, чтобы текст оставался читаемым
async function prepareImages(files) {
  const out = [];
  for (const f of files) {
    const url = URL.createObjectURL(f);
    const img = await new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = url; });
    const W = img.naturalWidth, H = img.naturalHeight, tileH = Math.round(W * 2), overlap = Math.round(W * 0.12);
    const tiles = H > W * 2.4 ? Math.ceil((H - overlap) / (tileH - overlap)) : 1;
    for (let t = 0; t < tiles; t++) {
      const y = tiles === 1 ? 0 : Math.min(t * (tileH - overlap), H - tileH), h = tiles === 1 ? H : tileH;
      const scale = Math.min(1, 1568 / Math.max(W, h));
      const c = document.createElement('canvas'); c.width = Math.round(W * scale); c.height = Math.round(h * scale);
      const g = c.getContext('2d'); g.fillStyle = '#fff'; g.fillRect(0, 0, c.width, c.height);
      g.drawImage(img, 0, y, W, h, 0, 0, c.width, c.height);
      out.push(c.toDataURL('image/jpeg', 0.85).split(',')[1]);
    }
    URL.revokeObjectURL(url);
  }
  return out;
}

      `<button class="chip ${card === c.id ? 'on' : ''}" data-id="${c.id}">${esc(c.name)}</button>`).join('');
    drawCards();
    $('#im-card').onclick = e => { const b = e.target.closest('[data-id]'); if (b) { card = +b.dataset.id; drawCards(); } };
    $('#im-files').onchange = e => {
      files = [...e.target.files].slice(0, 10);
      $('#im-shots').innerHTML = files.map(f => `<img src="${URL.createObjectURL(f)}" alt="">`).join('');
      $('#im-pick').style.height = files.length ? '56px' : '';
      $('#im-pick .big').style.display = $('#im-pick span:nth-child(3)').style.display = files.length ? 'none' : '';
      $('#im-pick').querySelector('span:nth-child(2)').textContent = files.length ? `Выбрано: ${files.length} · заменить` : 'Выбрать скриншоты';
      $('#im-go').disabled = !files.length;
    };
    $('#im-go').onclick = async () => {
      const sh = $('#sheet');
      sh.innerHTML = `<div class="grab"></div><div class="spinner"></div>
        <div style="text-align:center;font-weight:600" id="im-status">Готовлю картинки…</div>
        <div class="muted" style="text-align:center;font-size:13px;margin:6px 0 30px">Обычно это занимает 5–20 секунд</div>`;
      try {
        const imgs = await prepareImages(files);
        const found = [];
        for (let i = 0; i < imgs.length; i += 6) {
          $('#im-status').textContent = imgs.length > 6 ? `ИИ читает скрины… (${Math.min(i + 6, imgs.length)} из ${imgs.length})` : 'ИИ читает скрины…';
          const r = await fetch(meta.ai, { method: 'POST', headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ initData: (tg && tg.initData) || '', images: imgs.slice(i, i + 6), context: {
              today: isoDay(new Date()), currency: cardCur(card),
              expenseCats: [...EXP_CATS.map(c => c[0]), ...meta.cats], incomeCats: [...INC_CATS.map(c => c[0]), ...meta.icats] } }) });
          const data = await r.json().catch(() => ({ error: 'Посредник вернул непонятный ответ (' + r.status + ')' }));
          if (!r.ok || data.error) throw new Error(data.error || 'Ошибка ' + r.status);
          found.push(...data.transactions);
        }
        openReview(found, card);
      } catch (e) {
        openSheet(`<h2>Не получилось</h2><div class="box" style="background:var(--bg2);box-shadow:none">${esc(e.message || e)}</div>
          <button class="btn" id="im-retry">Попробовать снова</button>`, () => { $('#im-retry').onclick = openImport; });
      }
    };
  });
}

function openReview(list, card) {
  const cur = cardCur(card);
  const allCats = k => k === 'i' ? [...INC_CATS.map(c => c[0]), ...meta.icats] : [...EXP_CATS.map(c => c[0]), ...meta.cats];
  // уже ли есть такая операция (та же карта, тип, сумма, ±1 день)
  const isDup = (k, a, date) => ops.some(o => o.f === card && o.k === k && o.a === a && Math.abs(dayDiff(isoDay(o.t * 1000)) - dayDiff(date)) <= 1);
  const seen = new Set();
  const items = list.map(t => {
    const k = t.type === 'income' ? 'i' : 'e';
    let a = Math.round(Math.abs(+t.amount || 0) * 100), note = (t.merchant || '').trim().slice(0, 60);
    const tc = (t.currency || cur).toUpperCase();
    if (tc !== cur && CURS[tc]) { note += ` (${money(a, false, tc)})`; a = conv(a, tc, cur); }
    let date = /^\d{4}-\d{2}-\d{2}$/.test(t.date || '') ? t.date : isoDay(new Date());
    if (dayDiff(date) > 0) date = isoDay(new Date());
    const c = allCats(k).includes(t.category) ? t.category : 'Другое';
    const key = [k, a, date, note].join('|');
    const dupInBatch = seen.has(key); seen.add(key);
    const dup = isDup(k, a, date);
    return { k, a, note, date, time: /^\d{1,2}:\d{2}$/.test(t.time || '') ? t.time : '', c, own: !!t.own_transfer, dup, on: a > 0 && !dup && !dupInBatch && !t.own_transfer };
  }).filter(x => x.a > 0).sort((x, y) => y.date.localeCompare(x.date));

  if (!items.length) {
    return openSheet(`<h2>Операций не найдено</h2><div class="muted" style="margin-bottom:16px">На скриншотах не удалось найти операции с суммами. Попробуйте скрин списка операций или выписки.</div>
      <button class="btn" id="im-retry">Загрузить другие</button>`, () => { $('#im-retry').onclick = openImport; });
  }
  const draw = () => {
    const sel = items.filter(x => x.on);
    const sum = sel.reduce((s, x) => s + (x.k === 'e' ? -x.a : x.a), 0);
    $('#rv-list').innerHTML = items.map((x, i) => {
      const ci = catInfo(x.c, x.k);
      return `<div class="imp ${x.on ? 'on' : 'off'}" data-i="${i}">
        <button class="chk" data-act="toggle">${x.on ? '✓' : ''}</button>
        <div class="ic" style="${tint(ci.col)}">${ci.e}</div>
        <div class="mid"><div class="t1">${esc(x.note || x.c)}</div>
          <div class="meta">
            <select data-act="cat">${allCats(x.k).map(c => `<option ${c === x.c ? 'selected' : ''}>${esc(c)}</option>`).join('')}</select>
            <input type="date" data-act="date" value="${x.date}">
            ${x.dup ? '<span class="tag">уже есть в учёте</span>' : ''}${x.own ? '<span class="tag">между своими счетами</span>' : ''}
          </div></div>
        <button class="amt num ${x.k === 'i' ? 'in' : ''}" data-act="kind" title="Нажмите, чтобы поменять расход/доход">${money(x.k === 'e' ? -x.a : x.a, true, cur)}</button>
      </div>`;
    }).join('');
    $('#rv-save').textContent = sel.length ? `Добавить ${sel.length} ${plural(sel.length, 'операцию', 'операции', 'операций')} · ${money(sum, true, cur)}` : 'Ничего не выбрано';
    $('#rv-save').disabled = !sel.length;
  };
  openSheet(`<h2>Проверьте операции</h2>
    <div class="muted" style="font-size:13px;margin:-6px 0 8px">Карта: <b>${esc(cardName(card))}</b> · найдено ${items.length}.
      Нажмите на сумму, чтобы поменять расход ↔ доход. Повторы и переводы между своими счетами отключены.</div>
    <div id="rv-list"></div>
    <button class="btn" id="rv-save" style="margin-top:12px;position:sticky;bottom:0"></button>`, () => {
    draw();
    $('#rv-list').onclick = e => {
      const row = e.target.closest('[data-i]'), act = e.target.closest('[data-act]'); if (!row || !act) return;
      const x = items[+row.dataset.i];
      if (act.dataset.act === 'toggle') { x.on = !x.on; haptic('tap'); draw(); }
      if (act.dataset.act === 'kind') { x.k = x.k === 'e' ? 'i' : 'e'; if (!allCats(x.k).includes(x.c)) x.c = 'Другое'; draw(); }
    };
    $('#rv-list').onchange = e => {
      const row = e.target.closest('[data-i]'), act = e.target.dataset.act; if (!row) return;
      const x = items[+row.dataset.i];
      if (act === 'cat') x.c = e.target.value;
      if (act === 'date' && e.target.value) x.date = e.target.value;
      draw();
    };
    $('#rv-save').onclick = async () => {
      const sel = items.filter(x => x.on); if (!sel.length) return;
      $('#rv-save').disabled = true;
      const added = sel.map(x => {
        const d = new Date(x.date + 'T' + (x.time ? x.time.padStart(5, '0') : '12:00'));
        return { id: meta.next++, t: Math.floor(d.getTime() / 1000), k: x.k, a: x.a, c: x.c, f: card, to: 0, n: x.note };
      });
      ops.push(...added); sortOps();
      try {
        await saveOps(Math.min(...added.map(o => ops.indexOf(o))));
        haptic('success'); closeAll(); render();
        toast(`Добавлено: ${added.length} · ${cardName(card)}: ${hm(balance(card), cur)}`);
      } catch (e) { $('#rv-save').disabled = false; toast('Не удалось сохранить, попробуйте ещё раз'); }
    };
  });
}
const plural = (n, a, b, c) => { const m = n % 10, h = n % 100; return m === 1 && h !== 11 ? a : m >= 2 && m <= 4 && (h < 12 || h > 14) ? b : c; };

/* ================================================================ События */
const OPEN = { budgets: openBudgets, goals: openGoals, recur: openRecurList, cards: openCardsList, currency: openCurrency, cats: openCats, pin: openPinSettings, import: openImport, aiset: openAiSettings,
  hide: async () => { meta.hide = !meta.hide; await saveMeta(); render(); } };
document.addEventListener('click', e => {
  if (e.target.closest('#sheet')) return;
  const t = e.target;
  const nav = t.closest('nav [data-page]');
  if (nav) { page = nav.dataset.page; haptic('tap'); render(); window.scrollTo(0, 0); return; }
  const go = t.closest('[data-goto]'); if (go) { page = go.dataset.goto; render(); window.scrollTo(0, 0); return; }
  const op = t.closest('[data-open]'); if (op) return OPEN[op.dataset.open]();
  const q = t.closest('[data-quick]'); if (q) return openAdd(q.dataset.quick);
  const card = t.closest('#cards [data-card]'); if (card) return openCard(+card.dataset.card);
  if (t.closest('[data-new-card]')) return openCard(null);
  const pay = t.closest('[data-pay]'); if (pay) return payRecur(+pay.dataset.pay);
  const row = t.closest('.page [data-op]'); if (row) return openOp(+row.dataset.op);
  const hk = t.closest('[data-hkind]'); if (hk) { hKind = hk.dataset.hkind; renderHistory(); return; }
  const hc = t.closest('[data-hcard]'); if (hc) { hCard = +hc.dataset.hcard; renderHistory(); return; }
});
$('#btn-add').onclick = () => openAdd('e');
$('#all-cards').onclick = openCardsList;
$('#cur-btn').onclick = openCurrency;
$('#eye').onclick = OPEN.hide;
$('#total').onclick = OPEN.hide;
$('#backdrop').onclick = closeAll;
$('#q').oninput = () => renderHistory();
$('#m-prev').onclick = () => { sMonth--; renderStats(); };
$('#m-next').onclick = () => { sMonth++; renderStats(); };
$('#s-kind').onclick = e => { if (e.target.dataset.k) { sKind = e.target.dataset.k; renderStats(); } };
if (tg && tg.BackButton) tg.BackButton.onClick(closeSheet);

(async () => {
  if (tg) {
    tg.ready(); tg.expand();
    try { tg.setHeaderColor('secondary_bg_color'); tg.setBackgroundColor('secondary_bg_color'); } catch (e) {}
    try { if (tg.isVersionAtLeast('7.7')) tg.disableVerticalSwipes(); } catch (e) {}
  }
  try { await load(); } catch (e) { $('#loading').textContent = 'Не удалось загрузить данные: ' + e; return; }
  $('#loading').remove();
  await initBio();
  if (meta.pin) { onUnlock = () => render(); lockApp(); }
  else setupPin(() => render(), true);   // код обязателен: просим придумать при первом открытии
  if (cards.some(c => c.cur !== meta.base) || goals.some(g => g.cur !== meta.base) || meta.ratesAt) { if (await refreshRates()) render(); }
})();
</script>
